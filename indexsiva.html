<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>

<style>
555
body{
    font-family:Arial;
    background:#eaf2f8;
    margin:30px;
}

.container{
    width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

input{
    padding:10px;
    margin:5px;
}

button{
    padding:10px 18px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table,th,td{
    border:1px solid gray;
}

th{
    background:#3498db;
    color:white;
}

th,td{
    padding:10px;
    text-align:center;
}

#clock{
    color:green;
    font-size:20px;
    font-weight:bold;
}

.quote{
    color:blue;
    font-style:italic;
}

</style>

</head>

<body>

<div class="container">

<h1>Student Dashboard</h1>

<p id="clock"></p>

<hr>

<h3>Add Student</h3>

<input type="text" id="name" placeholder="Student Name">

<input type="number" id="marks" placeholder="Marks">

<button onclick="addStudent()">

Add Student

</button>

<button onclick="clearTable()">

Clear All

</button>

<hr>

<h3>Search Student</h3>

<input
type="text"
id="search"
placeholder="Search..."
onkeyup="searchStudent()">

<hr>

<h3>Percentage Calculator</h3>

<input type="number" id="obtained" placeholder="Obtained Marks">

<input type="number" id="total" placeholder="Total Marks">

<button onclick="calculatePercentage()">

Calculate

</button>

<p id="percentage"></p>

<hr>

<h3>Random Motivation</h3>

<button onclick="showQuote()">

Generate Quote

</button>

<p class="quote" id="quote"></p>

<hr>

<h3>Total Students :</h3>

<p id="count">0</p>

<hr>

<table id="studentTable">

<tr>

<th>Name</th>

<th>Marks</th>

<th>Grade</th>

<th>Action</th>

</tr>

</table>

</div>

<script>

let totalStudents=0;

function updateClock(){

document.getElementById("clock").innerHTML=

new Date().toLocaleString();

}

setInterval(updateClock,1000);

updateClock();



function calculateGrade(marks){

if(marks>=90)

return "A+";

else if(marks>=80)

return "A";

else if(marks>=70)

return "B";

else if(marks>=60)

return "C";

else if(marks>=50)

return "D";

else

return "Fail";

}



function addStudent(){

let name=document.getElementById("name").value;

let marks=Number(document.getElementById("marks").value);

if(name=="" || marks==""){

alert("Enter all details");

return;

}

let table=document.getElementById("studentTable");

let row=table.insertRow();

row.insertCell(0).innerHTML=name;

row.insertCell(1).innerHTML=marks;

row.insertCell(2).innerHTML=calculateGrade(marks);

let btn=document.createElement("button");

btn.innerHTML="Delete";

btn.onclick=function(){

row.remove();

totalStudents--;

document.getElementById("count").innerHTML=totalStudents;

};

row.insertCell(3).appendChild(btn);

totalStudents++;

document.getElementById("count").innerHTML=totalStudents;

document.getElementById("name").value="";

document.getElementById("marks").value="";

}



function calculatePercentage(){

let obtained=

Number(document.getElementById("obtained").value);

let total=

Number(document.getElementById("total").value);

let per=(obtained/total)*100;

document.getElementById("percentage").innerHTML=

"Percentage : "+per.toFixed(2)+"%";

}



const quotes=[

"Success comes from practice.",

"Never stop learning.",

"Dream big and work hard.",

"Consistency beats talent.",

"Every expert was once a beginner.",

"Believe in yourself.",

"Code. Learn. Repeat."

];



function showQuote(){

let random=Math.floor(Math.random()*quotes.length);

document.getElementById("quote").innerHTML=

quotes[random];

}



function searchStudent(){

let input=document.getElementById("search").value.toUpperCase();

let table=document.getElementById("studentTable");

let tr=table.getElementsByTagName("tr");

for(let i=1;i<tr.length;i++){

let td=tr[i].getElementsByTagName("td")[0];

if(td){

let text=td.innerHTML.toUpperCase();

if(text.indexOf(input)>-1)

tr[i].style.display="";

else

tr[i].style.display="none";

}

}

}



function clearTable(){

let table=document.getElementById("studentTable");

while(table.rows.length>1){

table.deleteRow(1);

}

totalStudents=0;

document.getElementById("count").innerHTML=0;

}

</script>

</body>
</html>
